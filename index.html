<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>Remote Learning Platform</header>

    <div class="container">
        <!-- Home Section -->
        <div id="home-section">
            <img src="https://via.placeholder.com/150" alt="Logo">
            <h2>Welcome to Remote Learning</h2>
            <button class="main-btn" onclick="showLoginModal()">Login</button>
            <button class="main-btn" onclick="showSignupModal()">Sign Up</button>
        </div>

        <!-- Courses Section (after login) -->
        <div id="courses-section">
            <h2>Available Courses</h2>
            <div id="courses-list"></div>
        </div>

        <!-- Lessons Section -->
        <div id="lessons-section" style="display:none;">
            <h2 id="course-title"></h2>
            <div id="lessons-list"></div>
            <div id="assignments-list"></div>
        </div>

        <!-- Quiz Section -->
        <div id="quiz-section" style="display:none;">
            <h2 id="quiz-title"></h2>
            <div id="quiz-questions"></div>
        </div>
    </div>

    <!-- Login Modal -->
    <div id="login-modal" class="modal">
        <div class="modal-content">
            <h2>Login</h2>
            <input type="email" id="login-email" placeholder="Email">
            <input type="password" id="login-password" placeholder="Password">
            <button class="main-btn" onclick="login()">Login</button>
            <p>Don't have an account? <a onclick="switchToSignup()">Sign Up</a></p>
        </div>
    </div>

    <!-- Signup Modal -->
    <div id="signup-modal" class="modal">
        <div class="modal-content">
            <h2>Sign Up</h2>
            <input type="text" id="signup-name" placeholder="Name">
            <input type="email" id="signup-email" placeholder="Email">
            <input type="password" id="signup-password" placeholder="Password">
            <button class="main-btn" onclick="signup()">Sign Up</button>
            <p>Already have an account? <a onclick="switchToLogin()">Login</a></p>
        </div>
    </div>

    <script src="js/script.js"></script>

</body>

</html>
